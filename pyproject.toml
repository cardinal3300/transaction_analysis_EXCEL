[tool.poetry]
name = "transaction-analysis-excel"
version = "0.1.0"
description = "Приложение для анализа транзакций из Excel"
authors = ["Zherdev Igor <cardinal3300@.com>"]
packages = [{ include = "src" }]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.3.1"
pip = "^25.1.1"
requests = "^2.32.4"
python-dotenv = "^1.1.1"
openpyxl = "^3.1.5"
poetry-core = "^2.1.3"
yfinance = "^0.2.65"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-mock = "^3.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ["py313"]
exclude = """ \\.git """

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]

[tool.isort]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'